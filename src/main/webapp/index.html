<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <div class="container topbar-inner">
        <svg class="logo" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="currentColor"/>
            <path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
            <h1>TaskFlow</h1>
            <p>Tareas del equipo</p>
        </div>
    </div>
</header>

<main class="container">

    <!-- Errores del servidor o de conexión -->
    <div id="error" class="alert" role="alert" hidden>
        <span id="error-text"></span>
        <button type="button" id="error-close" aria-label="Cerrar mensaje">&times;</button>
    </div>

    <div class="layout">

        <!-- ===== Formulario: sirve para crear y para editar ===== -->
        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">Nueva tarea</h2>

            <!-- novalidate: la validación la hace app.js para mostrar el mensaje junto al campo -->
            <form id="task-form" novalidate>
                <input type="hidden" id="task-id">

                <div class="field" id="title-field">
                    <div class="label-row">
                        <label for="title">Título <span class="req" aria-hidden="true">*</span></label>
                        <span class="counter" id="title-count" aria-hidden="true">0/200</span>
                    </div>
                    <input type="text" id="title" maxlength="200" autocomplete="off" aria-describedby="title-error">
                    <p class="field-error" id="title-error" hidden></p>
                </div>

                <div class="field">
                    <div class="label-row">
                        <label for="description">Descripción</label>
                        <span class="counter" id="description-count" aria-hidden="true">0/1000</span>
                    </div>
                    <textarea id="description" rows="3" maxlength="1000"></textarea>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="priority">Prioridad</label>
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="status">Estado</label>
                        <select id="status">
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Crear tarea</button>
                    <button type="button" id="cancel" class="btn btn-secondary" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <!-- ===== Listado ===== -->
        <section aria-labelledby="list-title">
            <div class="list-header">
                <h2 id="list-title">Tareas <span id="count" class="count" hidden></span></h2>

                <div class="filters" role="group" aria-label="Filtrar por estado">
                    <button type="button" class="chip is-active" data-status="" aria-pressed="true">Todas</button>
                    <button type="button" class="chip" data-status="Pending" aria-pressed="false">Pending</button>
                    <button type="button" class="chip" data-status="In Progress" aria-pressed="false">In Progress</button>
                    <button type="button" class="chip" data-status="Completed" aria-pressed="false">Completed</button>
                </div>
            </div>

            <ul id="task-list" class="task-list">
                <li class="empty">Cargando tareas…</li>
            </ul>
        </section>

    </div>
</main>

<!-- Aviso breve tras crear, editar o eliminar -->
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
